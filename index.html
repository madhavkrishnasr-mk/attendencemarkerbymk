<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Attendance Pro Elite</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #1a1a1a;
            --border-color: #e4e6eb;
            --btn-primary: #0056b3;
            --btn-secondary: #6c757d;
        }

        .dark-mode {
            --bg-color: #18191a;
            --card-bg: #242526;
            --text-color: #e4e6eb;
            --border-color: #3e4042;
            --btn-primary: #2d88ff;
            --btn-secondary: #4e4f50;
        }

        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-color);
            margin: 0; padding: 15px; 
            display: flex; flex-direction: column; align-items: center;
            transition: 0.3s;
        }

        .card { 
            background-color: var(--card-bg); 
            width: 100%; max-width: 480px; padding: 20px; 
            border-radius: 15px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); 
            box-sizing: border-box; 
        }

        .hidden { display: none !important; }
        
        h3 { 
            margin-top: 0; border-bottom: 2px solid var(--border-color); 
            padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; 
        }

        .header-btns { display: flex; gap: 5px; }

        input[type="text"], input[type="number"], input[type="date"], input[type="email"], input[type="file"], input[type="tel"] { 
            width: 100%; padding: 12px; margin-bottom: 10px; 
            border: 1px solid var(--border-color); border-radius: 8px; 
            box-sizing: border-box; font-size: 16px;
            background: var(--bg-color); color: var(--text-color);
        }

        button { 
            background-color: var(--btn-primary); color: white; border: none; 
            padding: 10px; font-weight: bold; border-radius: 8px; cursor: pointer; 
        }

        .btn-full { width: 100%; font-size: 16px; margin-top: 15px; padding: 15px; }
        .btn-small { font-size: 12px; padding: 6px 10px; }
        .theme-btn { background: none; font-size: 20px; color: var(--text-color); }

        .student-row { 
            background-color: var(--bg-color); padding: 12px; margin: 10px 0; 
            border-radius: 10px; border: 1px solid var(--border-color); 
        }

        .student-main { display: flex; align-items: center; font-weight: bold; margin-bottom: 8px; }
        .student-photo { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; margin-right: 12px; border: 2px solid var(--btn-primary); }
        .reason-box { width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 5px; background: var(--card-bg); color: var(--text-color); }

        /* History Styles */
        .history-card { 
            background-color: var(--card-bg); padding: 15px; margin-bottom: 15px; 
            border-radius: 12px; border-left: 6px solid var(--btn-primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .summary-box { 
            display: flex; justify-content: space-around; 
            background: var(--bg-color); padding: 10px; border-radius: 8px; margin: 10px 0;
            font-weight: bold; font-size: 13px;
        }
        .line-item { 
            display: flex; justify-content: space-between; padding: 8px 0; 
            border-bottom: 1px solid var(--border-color); font-size: 14px;
        }
        .status-p { color: #28a745; font-weight: bold; }
        .status-a { color: #dc3545; font-weight: bold; }

        .btn-wa { background-color: #25d366; font-size: 11px; padding: 4px 8px; margin-top: 5px; }
    </style>
</head>
<body>

<div class="card">
    <h3>
        <span id="display-class-name">Loading...</span>
        <div class="header-btns">
            <button class="theme-btn" onclick="toggleTheme()" id="theme-icon">🌓</button>
            <button class="btn-small" style="background:var(--btn-secondary)" onclick="showView('edit-view')">⚙️</button>
        </div>
    </h3>

    <div id="attendance-view">
        <div style="display:flex; gap:10px;">
            <input type="date" id="class-date">
            <button class="btn-history" style="background:#28a745; margin-bottom:10px;" onclick="showView('history-view')">📁 History</button>
        </div>
        <div id="student-container"></div>
        <button id="submit-btn" class="btn-full" onclick="submitAttendance()">Save Attendance</button>
    </div>

    <div id="edit-view" class="hidden">
        <label>Class Name:</label>
        <div style="display:flex; gap:5px;"><input type="text" id="class-name"><button onclick="saveSettings()">Save</button></div>
        <hr>
        <label>Add Student:</label>
        <div style="display:flex; gap:5px;">
            <input type="number" id="new-roll" placeholder="Roll" style="width:30%">
            <input type="text" id="new-name" placeholder="Name">
        </div>
        <input type="tel" id="new-phone" placeholder="WhatsApp Number">
        <input type="file" id="new-photo" accept="image/*">
        <button class="btn-full" onclick="handleAddStudent()">+ Add Student</button>
        <button class="btn-full" style="background:var(--btn-secondary)" onclick="showView('attendance-view')">Back to Home</button>
        <div id="management-list"></div>
    </div>

    <div id="history-view" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <b>History Logs</b>
            <button class="btn-small" style="background:var(--btn-secondary)" onclick="showView('attendance-view')">Back</button>
        </div>
        <div id="history-container" style="margin-top:15px;"></div>
        <button class="btn-full" style="background:#dc3545" onclick="clearHistory()">Clear History</button>
    </div>
</div>

<script>
    let myClass = JSON.parse(localStorage.getItem("attendance_roster")) || [];
    let currentClass = localStorage.getItem("class_details") || "New Class";
    let historyData = JSON.parse(localStorage.getItem("attendance_history")) || [];
    const defaultAvatar = 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="%23ccc"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>';

    document.getElementById('class-date').valueAsDate = new Date();

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        const isDark = document.body.classList.contains('dark-mode');
        localStorage.setItem("theme", isDark ? "dark" : "light");
    }

    if(localStorage.getItem("theme") === "dark") document.body.classList.add('dark-mode');

    function showView(id) {
        document.querySelectorAll('.card > div').forEach(v => v.classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        if(id === 'attendance-view') updateScreen();
        if(id === 'history-view') renderHistory();
    }

    function updateScreen() {
        document.getElementById("class-name").value = currentClass;
        document.getElementById("display-class-name").innerText = currentClass;
        const container = document.getElementById("student-container");
        container.innerHTML = "";
        myClass.sort((a, b) => a.rollNo - b.rollNo);

        myClass.forEach((s, i) => {
            container.innerHTML += `
                <div class="student-row">
                    <div class="student-main">
                        <input type="checkbox" style="transform:scale(1.5); margin-right:15px;" id="check-${i}" checked>
                        <img src="${s.photo || defaultAvatar}" class="student-photo">
                        <label>Roll ${s.rollNo}: ${s.name}</label>
                    </div>
                    <input type="text" class="reason-box" id="reason-${i}" placeholder="Remarks if absent">
                </div>`;
        });
    }

    function handleAddStudent() {
        const r = document.getElementById("new-roll").value;
        const n = document.getElementById("new-name").value;
        const p = document.getElementById("new-phone").value;
        const file = document.getElementById("new-photo").files[0];

        if (r && n) {
            const reader = new FileReader();
            reader.onload = function(e) {
                myClass.push({ rollNo: parseInt(r), name: n, phone: p, photo: e.target.result });
                localStorage.setItem("attendance_roster", JSON.stringify(myClass));
                showView('attendance-view');
            };
            if(file) reader.readAsDataURL(file);
            else {
                myClass.push({ rollNo: parseInt(r), name: n, phone: p, photo: "" });
                localStorage.setItem("attendance_roster", JSON.stringify(myClass));
                showView('attendance-view');
            }
        }
    }

    function submitAttendance() {
        const date = document.getElementById('class-date').value;
        let presentCount = 0;
        let fullList = myClass.map((s, i) => {
            const isPresent = document.getElementById(`check-${i}`).checked;
            if(isPresent) presentCount++;
            return {
                roll: s.rollNo,
                name: s.name,
                status: isPresent ? "Present" : "Absent",
                reason: document.getElementById(`reason-${i}`).value || "",
                phone: s.phone || ""
            };
        });

        historyData.unshift({ 
            date, 
            total: myClass.length, 
            present: presentCount, 
            absent: myClass.length - presentCount,
            records: fullList 
        });
        
        localStorage.setItem("attendance_history", JSON.stringify(historyData));
        alert("Attendance Saved!");
    }

    function renderHistory() {
        const container = document.getElementById("history-container");
        container.innerHTML = "";
        
        historyData.forEach(day => {
            let recordsHTML = day.records.map(r => `
                <div class="line-item">
                    <span>${r.roll}. ${r.name}</span>
                    <div style="text-align:right">
                        <span class="${r.status === 'Present' ? 'status-p' : 'status-a'}">${r.status}</span>
                        ${r.status === 'Absent' && r.phone ? `<br><button class="btn-wa" onclick="sendWA('${r.phone}','${r.name}','${day.date}')">WA</button>` : ''}
                    </div>
                </div>
            `).join('');

            container.innerHTML += `
                <div class="history-card">
                    <div style="display:flex; justify-content:space-between; font-weight:bold;">
                        <span>📅 ${day.date}</span>
                    </div>
                    <div class="summary-box">
                        <span>Total: ${day.total}</span>
                        <span style="color:#28a745">Present: ${day.present}</span>
                        <span style="color:#dc3545">Absent: ${day.absent}</span>
                    </div>
                    <div style="margin-top:10px;">${recordsHTML}</div>
                </div>`;
        });
    }

    function sendWA(num, name, date) {
        const msg = `Dear Parent, your child ${name} was ABSENT for class on ${date}.`;
        window.open(`https://wa.me/${num}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function saveSettings() {
        currentClass = document.getElementById("class-name").value;
        localStorage.setItem("class_details", currentClass);
        alert("Saved!");
        updateScreen();
    }

    function clearHistory() { if(confirm("Clear all?")) { historyData = []; localStorage.setItem("attendance_history", "[]"); renderHistory(); } }

    showView('attendance-view');
</script>
</body>
</html>
