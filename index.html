<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Attendance Taker Pro - Ultimate Teacher Edition</title>

    <style>
        /* --- PROFESSIONAL COLOR PALETTE --- */
        :root {
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-main: #1c1e21;
            --text-secondary: #606770;
            --border-color: #dddfe2;
            --primary-blue: #0056b3;
            --success-green: #28a745;
            --danger-red: #dc3545;
            --info-cyan: #17a2b8;
            --warning-orange: #f39c12;
        }

        .dark-mode {
            --bg-color: #18191a;
            --card-bg: #242526;
            --text-main: #e4e6eb;
            --text-secondary: #b0b3b8;
            --border-color: #3e4042;
            --primary-blue: #2d88ff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background 0.3s ease;
        }

        .main-card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 500px;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            box-sizing: border-box;
        }

        .hidden { display: none !important; }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--bg-color);
            color: var(--text-main);
            font-size: 15px;
            box-sizing: border-box;
        }

        label { font-size: 12px; font-weight: bold; color: var(--text-secondary); display: block; margin-bottom: 4px; }

        button { cursor: pointer; border: none; border-radius: 8px; font-weight: 600; padding: 10px; transition: 0.2s ease; }

        .btn-full { width: 100%; padding: 15px; font-size: 16px; margin-top: 10px; color: white; }
        .btn-primary { background-color: var(--primary-blue); color: white; }
        .btn-success { background-color: var(--success-green); color: white; }
        .btn-danger { background-color: var(--danger-red); color: white; }
        .btn-info { background-color: var(--info-cyan); color: white; }
        .btn-secondary { background-color: var(--text-secondary); color: white; }

        /* --- SETUP SCREEN --- */
        .welcome-icon { font-size: 40px; text-align: center; margin-bottom: 10px; display: block; }

        /* --- ATTENDANCE UI --- */
        .student-item { background-color: var(--bg-color); padding: 12px; margin-bottom: 12px; border-radius: 10px; border: 1px solid var(--border-color); }
        .student-top-row { display: flex; justify-content: space-between; align-items: center; }
        .student-meta { display: flex; align-items: center; gap: 10px; }
        .student-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid var(--primary-blue); }

        .attendance-toggle { display: flex; width: 100px; height: 35px; border: 1px solid var(--border-color); border-radius: 6px; overflow: hidden; }
        .toggle-opt { flex: 1; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: bold; background-color: var(--card-bg); color: var(--text-main); cursor: pointer; }
        .toggle-opt.p-active { background-color: var(--success-green); color: white; }
        .toggle-opt.a-active { background-color: var(--danger-red); color: white; }

        .extra-opts { display: flex; gap: 5px; margin-top: 8px; justify-content: flex-end; padding-top: 8px; border-top: 1px dashed var(--border-color); }
        .sub-btn { font-size: 10px; padding: 5px 10px; border-radius: 4px; background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-main); }
        .sub-btn.l-active { background: var(--warning-orange); color: white; border-color: var(--warning-orange); }

        /* --- REPORT UI --- */
        .report-card { background-color: var(--bg-color); padding: 12px; margin-bottom: 12px; border-radius: 10px; border: 1px solid var(--border-color); position: relative;}
        .report-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 10px; font-size: 11px; text-align: center; }
        .stat-box { background: var(--card-bg); padding: 6px; border-radius: 6px; border: 1px solid var(--border-color); font-weight: bold; }
        .danger-zone { border: 2px solid var(--danger-red) !important; background-color: #fff0f0; }
        .badge-100 { position: absolute; top: 5px; right: 5px; background: gold; color: black; font-size: 9px; padding: 2px 6px; border-radius: 10px; font-weight: bold; }

        /* --- HISTORY --- */
        .history-card { background: var(--bg-color); padding: 12px; margin-bottom: 12px; border-radius: 10px; border-left: 5px solid var(--primary-blue); border: 1px solid var(--border-color); }
        .student-list-row { display: flex; justify-content: space-between; font-size: 12px; padding: 6px 0; border-bottom: 1px dashed var(--border-color); align-items: center;}
        .msg-btn { font-size: 10px; padding: 4px 8px; border-radius: 4px; color: white; margin-left: 3px;}

        /* --- SETTINGS TABS --- */
        .settings-tabs { display: flex; gap: 5px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 10px; font-size: 13px; background-color: var(--bg-color); color: var(--text-secondary); border: 1px solid var(--border-color); }
        .tab-btn.active { background-color: var(--primary-blue); color: white; border-color: var(--primary-blue); }
        
        .trend-box { background: #e8f4fd; padding: 10px; border-radius: 8px; margin-bottom: 15px; font-size: 13px; text-align: center; border: 1px solid var(--primary-blue); }
        .csv-reminder { font-size: 11px; color: var(--danger-red); font-weight: bold; text-align: center; margin-top: 5px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="header-section" id="main-header">
            <h2 id="app-title">Attendance Taker Pro</h2>
            <div id="header-buttons">
                <button onclick="toggleDarkMode()" style="background:none; font-size:22px;">🌓</button>
                <button onclick="showPage('settings-page')" class="btn-info">⚙️</button>
            </div>
        </div>

        <div id="setup-page" class="hidden">
            <div id="setup-back-btn" class="hidden" style="display:flex; justify-content:space-between; margin-bottom:15px;">
                <h3>Institution Setup</h3>
                <button onclick="showPage('settings-page')" class="btn-secondary">Back</button>
            </div>
            
            <div id="setup-welcome-text">
                <span class="welcome-icon">🎓</span>
                <h3 style="text-align: center; margin-top: 0;">Welcome to Attendance Taker Pro</h3>
                <p style="font-size: 13px; color: var(--text-secondary); text-align: center; margin-bottom: 20px;">Let's set up your institution details to get started.</p>
            </div>
            
            <label>Institution Name:</label>
            <input type="text" id="setup-school-name" placeholder="Institution Name">
            
            <label>Preferred Message Language:</label>
            <select id="setup-msg-language">
                <option value="en">English</option>
                <option value="ml">Malayalam</option>
            </select>
            
            <button class="btn-primary btn-full" onclick="completeSetup()">Save Institution Details</button>

            <div id="reset-zone" class="hidden" style="margin-top: 30px; padding-top: 15px; border-top: 2px dashed var(--danger-red);">
                <label style="color: var(--danger-red); font-size: 14px;">Danger Zone:</label>
                <p style="font-size:11px; color:var(--text-secondary);">This will delete all students, classes, and history permanently.</p>
                <button class="btn-danger btn-full" onclick="factoryResetApp()">⚠️ Factory Reset App</button>
            </div>
        </div>

        <div id="home-page" class="hidden">
            <label>Select Class:</label>
            <select class="class-dropdown" onchange="handleClassChange(this.value)"></select>

            <div style="display: flex; gap: 8px; margin-bottom: 15px;">
                <input type="date" id="attendance-date-input" style="margin-bottom: 0;">
                <button onclick="showPage('history-page')" class="btn-success" style="flex: 1;">📁 History</button>
                <button onclick="showPage('reports-page')" class="btn-info" style="flex: 1;">📊 Reports</button>
            </div>

            <div id="attendance-list-container"></div>
            <button class="btn-primary btn-full" onclick="saveAttendanceData()">Save Attendance Record</button>
        </div>

        <div id="settings-page" class="hidden">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px;">
                <h3>Settings</h3>
                <button onclick="showPage('home-page')" class="btn-secondary">Back</button>
            </div>
            
            <div class="settings-tabs">
                <button id="btn-tab-students" class="tab-btn active" onclick="switchSettingsTab('students')">Students</button>
                <button id="btn-tab-classes" class="tab-btn" onclick="switchSettingsTab('classes')">Classes</button>
            </div>

            <div id="tab-students-section">
                <label>Manage Students for:</label>
                <select class="class-dropdown" onchange="handleClassChange(this.value)"></select>
                <div style="display: flex; gap: 8px;"><input type="number" id="input-student-roll" placeholder="Roll"><input type="text" id="input-student-name" placeholder="Name"></div>
                <input type="tel" id="input-student-phone" placeholder="WhatsApp No">
                <input type="email" id="input-student-email" placeholder="Parent Email">
                <input type="file" id="input-student-photo" accept="image/*">
                <button id="submit-student-btn" class="btn-primary btn-full" onclick="saveStudentObject()">+ Add Student</button>
                <div id="student-list-management" style="margin-top: 15px;"></div>
            </div>

            <div id="tab-classes-section" class="hidden">
                <div style="display:flex; gap:8px;"><input type="text" id="input-new-class-name" placeholder="Class Name"><button onclick="createNewClass()" class="btn-primary">Add</button></div>
                <div id="class-list-management" style="margin-top:15px;"></div>
                
                <button class="btn-info btn-full" style="margin-top: 25px; font-size: 14px;" onclick="openSchoolSettings()">🏫 Edit Institution & Reset Options</button>
            </div>
        </div>

        <div id="reports-page" class="hidden">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px;"><h3>📊 Reports</h3><button onclick="showPage('home-page')" class="btn-secondary">Back</button></div>
            <select class="class-dropdown" onchange="handleClassChange(this.value); refreshReportsView();"></select>
            <select id="report-month-picker" onchange="refreshReportsView()"></select>
            <div id="trend-analysis" class="trend-box"></div>
            
            <button class="btn-primary btn-full" onclick="exportReportToCSV()">📥 Download .csv Report</button>
            <p class="csv-reminder">⚠️ Ensure filename ends with .csv before clicking Save</p>
            
            <div id="reports-display-container" style="margin-top: 15px;"></div>
        </div>

        <div id="history-page" class="hidden">
            <div style="display:flex; justify-content:space-between; margin-bottom:15px;"><h3>📁 History</h3><button onclick="showPage('home-page')" class="btn-secondary">Back</button></div>
            <select class="class-dropdown" onchange="handleClassChange(this.value); renderHistoryView();"></select>
            <div id="history-display-container"></div>
            <button class="btn-danger btn-full" onclick="wipeHistoryForCurrentClass()">Delete History</button>
        </div>
    </div>

    <script>
        function migrateOldData() {
            const oc = JSON.parse(localStorage.getItem("all_classes")), oh = JSON.parse(localStorage.getItem("attendance_history")), os = localStorage.getItem("school_name"), ol = localStorage.getItem("msg_lang");
            if (oc || oh) return { 
                isSetupComplete: true, 
                classes: oc || [], 
                activeClassId: localStorage.getItem("active_class_id") || (oc ? oc[0].id : null), 
                schoolName: os || "", 
                language: ol || "en", 
                history: oh || [] 
            };
            return null;
        }

        let appData = JSON.parse(localStorage.getItem("pro_attendance_data")) || migrateOldData() || { 
            isSetupComplete: false,
            classes: [{ id: Date.now(), name: "Class 1", roster: [] }], 
            activeClassId: null, 
            schoolName: "", 
            language: "en", 
            history: [] 
        };
        
        if (!appData.activeClassId && appData.classes.length) appData.activeClassId = appData.classes[0].id;
        
        if (appData.history.length > 0 || (appData.classes.length && appData.classes[0].roster.length > 0)) {
            appData.isSetupComplete = true;
        }

        let editingIdx = -1;

        function persistData() { localStorage.setItem("pro_attendance_data", JSON.stringify(appData)); }
        function toggleDarkMode() { document.body.classList.toggle('dark-mode'); localStorage.setItem("pro_theme", document.body.classList.contains('dark-mode') ? "dark" : "light"); }
        if(localStorage.getItem("pro_theme") === "dark") document.body.classList.add('dark-mode');

        function initApp() {
            if (!appData.isSetupComplete) {
                document.getElementById('header-buttons').classList.add('hidden');
                document.getElementById('setup-back-btn').classList.add('hidden');
                document.getElementById('setup-welcome-text').classList.remove('hidden');
                document.getElementById('reset-zone').classList.add('hidden');
                showPage('setup-page');
            } else {
                showPage('home-page');
            }
        }

        function openSchoolSettings() {
            document.getElementById('header-buttons').classList.add('hidden');
            document.getElementById('setup-back-btn').classList.remove('hidden');
            document.getElementById('setup-welcome-text').classList.add('hidden');
            document.getElementById('reset-zone').classList.remove('hidden');
            
            document.getElementById('setup-school-name').value = appData.schoolName;
            document.getElementById('setup-msg-language').value = appData.language;
            
            showPage('setup-page');
        }

        function completeSetup() {
            const sn = document.getElementById('setup-school-name').value;
            if (!sn || sn.trim() === "") return alert("Please enter your institution name to continue.");
            appData.schoolName = sn;
            appData.language = document.getElementById('setup-msg-language').value;
            appData.isSetupComplete = true;
            persistData();
            
            document.getElementById('header-buttons').classList.remove('hidden');
            alert("Institution Settings Saved!");
            showPage('home-page');
        }

        function showPage(pId) {
            document.querySelectorAll('.main-card > div:not(.header-section)').forEach(p => p.classList.add('hidden'));
            document.getElementById(pId).classList.remove('hidden');
            
            if (pId !== 'setup-page') {
                document.getElementById('header-buttons').classList.remove('hidden');
                refreshViews();
            }
            if (pId === 'reports-page') { setupMonthPicker(); refreshReportsView(); }
            if (pId === 'history-page') renderHistoryView();
        }

        function switchSettingsTab(t) {
            ['classes', 'students'].forEach(k => { document.getElementById(`tab-${k}-section`).classList.add('hidden'); document.getElementById(`btn-tab-${k}`).classList.remove('active'); });
            document.getElementById(`tab-${t}-section`).classList.remove('hidden'); document.getElementById(`btn-tab-${t}`).classList.add('active');
        }

        function refreshViews() {
            if(!appData.isSetupComplete) return;
            const cls = appData.classes.find(c => c.id == appData.activeClassId) || appData.classes[0];
            document.getElementById('app-title').innerText = cls.name;
            document.querySelectorAll('.class-dropdown').forEach(s => { s.innerHTML = appData.classes.map(c => `<option value="${c.id}" ${c.id == appData.activeClassId ? 'selected' : ''}>${c.name}</option>`).join(''); });
            
            const cont = document.getElementById('attendance-list-container');
            cont.innerHTML = cls.roster.length ? "" : "<p style='text-align:center; font-size:12px;'>No students. Add in Settings.</p>";
            cls.roster.sort((a,b) => a.roll - b.roll).forEach((s, idx) => {
                cont.innerHTML += `
                <div class="student-item" id="student-item-${s.roll}">
                    <div class="student-top-row">
                        <div class="student-meta">
                            <img src="${s.photo||''}" class="student-avatar" onerror="this.style.display='none'">
                            <span>Roll ${s.roll}: ${s.name}</span>
                        </div>
                        <div class="attendance-toggle">
                            <input type="hidden" id="status-val-${idx}" value="Present">
                            <div id="opt-p-${idx}" class="toggle-opt p-active" onclick="markStatus(${idx},'Present')">P</div>
                            <div id="opt-a-${idx}" class="toggle-opt" onclick="markStatus(${idx},'Absent')">A</div>
                        </div>
                    </div>
                    <div id="sub-opts-${idx}" class="extra-opts hidden">
                        <span style="font-size:10px; margin-right:auto; align-self:center;">Reason:</span>
                        <button id="opt-l-${idx}" class="sub-btn" onclick="markStatus(${idx},'Leave')">Leave</button>
                        <button id="opt-normal-a-${idx}" class="sub-btn sub-btn-active" style="background:#ddd" onclick="markStatus(${idx},'Absent')">Absent</button>
                    </div>
                </div>`;
            });

            document.getElementById('class-list-management').innerHTML = appData.classes.map(c => `<div style="display:flex; justify-content:space-between; margin-bottom:10px; padding:10px; background:var(--bg-color); border-radius:8px;"><span>${c.name}</span><button class="btn-danger" style="padding: 2px 10px;" onclick="removeClass(${c.id})">Del</button></div>`).join('');
            document.getElementById('student-list-management').innerHTML = cls.roster.map((s, idx) => `<div style="display:flex; justify-content:space-between; margin-bottom:10px; border-bottom: 1px solid var(--border-color); padding: 5px;"><span>${s.roll}. ${s.name}</span><div><button class="btn-info" style="color:white; padding: 2px 8px;" onclick="loadStudentForEdit(${idx})">Edit</button><button class="btn-danger" style="padding: 2px 8px;" onclick="removeStudent(${idx})">Del</button></div></div>`).join('');
        }

        function markStatus(idx, s) {
            document.getElementById(`status-val-${idx}`).value = s;
            const extra = document.getElementById(`sub-opts-${idx}`);
            if (s === 'Present') {
                extra.classList.add('hidden');
                document.getElementById(`opt-p-${idx}`).classList.add('p-active');
                document.getElementById(`opt-a-${idx}`).classList.remove('a-active');
            } else {
                extra.classList.remove('hidden');
                document.getElementById(`opt-p-${idx}`).classList.remove('p-active');
                document.getElementById(`opt-a-${idx}`).classList.add('a-active');
                document.getElementById(`opt-l-${idx}`).className = (s === 'Leave') ? 'sub-btn l-active' : 'sub-btn';
                document.getElementById(`opt-normal-a-${idx}`).style.background = (s === 'Absent') ? '#ddd' : 'transparent';
            }
        }

        function handleClassChange(id) { appData.activeClassId = id; persistData(); refreshViews(); }

        function createNewClass() {
            const n = document.getElementById('input-new-class-name').value;
            if (!n) return;
            appData.classes.push({ id: Date.now(), name: n, roster: [] });
            document.getElementById('input-new-class-name').value = ""; persistData(); refreshViews();
        }

        function saveStudentObject() {
            const cls = appData.classes.find(c => c.id == appData.activeClassId);
            const r = document.getElementById('input-student-roll').value, n = document.getElementById('input-student-name').value, ph = document.getElementById('input-student-phone').value, em = document.getElementById('input-student-email').value, f = document.getElementById('input-student-photo').files[0];
            const done = (img) => {
                const s = { roll: parseInt(r), name: n, phone: ph, email: em, photo: img || (editingIdx > -1 ? cls.roster[editingIdx].photo : null) };
                if (editingIdx > -1) { cls.roster[editingIdx] = s; editingIdx = -1; document.getElementById('submit-student-btn').innerText = "+ Add Student"; }
                else cls.roster.push(s);
                persistData(); refreshViews();
                ['roll','name','phone','email','photo'].forEach(k => document.getElementById(`input-student-${k}`).value = "");
            };
            if (f) { const rd = new FileReader(); rd.onload = (e) => done(e.target.result); rd.readAsDataURL(f); } else done(null);
        }

        function loadStudentForEdit(idx) {
            const cls = appData.classes.find(c => c.id == appData.activeClassId), s = cls.roster[idx];
            document.getElementById('input-student-roll').value = s.roll; document.getElementById('input-student-name').value = s.name; document.getElementById('input-student-phone').value = s.phone || ""; document.getElementById('input-student-email').value = s.email || "";
            document.getElementById('submit-student-btn').innerText = "Update"; editingIdx = idx;
        }

        function saveAttendanceData() {
            const cls = appData.classes.find(c => c.id == appData.activeClassId);
            const d = document.getElementById('attendance-date-input').value;
            if (!d) return alert("Select Date!");
            
            if (appData.history.find(h => h.classId == cls.id && h.date == d)) return alert("Attendance already saved for this date!");
            
            const dayNum = new Date(d).getDay();
            if (dayNum === 0 || dayNum === 6) {
                if(!confirm(`Today is ${dayNum === 0 ? 'Sunday' : 'Saturday'}. Are you sure you want to save attendance for a weekend?`)) return;
            }

            let p = 0;
            const recs = cls.roster.map((s, idx) => {
                const st = document.getElementById(`status-val-${idx}`).value;
                if (st !== 'Absent') p++;
                return { roll: s.roll, name: s.name, status: st, phone: s.phone, email: s.email };
            });
            appData.history.unshift({ id: Date.now(), date: d, className: cls.name, classId: cls.id, total: cls.roster.length, present: p, absent: cls.roster.length-p, students: recs });
            persistData(); alert("Attendance Saved!");
        }

        function renderHistoryView() {
            const cls = appData.classes.find(c => c.id == appData.activeClassId);
            const filtered = appData.history.filter(h => h.classId == cls.id);
            const cont = document.getElementById('history-display-container');
            cont.innerHTML = filtered.length ? filtered.map(h => {
                const aL = h.students.filter(s => s.status === 'Absent');
                const pL = h.students.filter(s => s.status !== 'Absent');
                return `
                <div class="history-card">
                    <b>📅 ${h.date}</b> - P: ${h.present} A: ${h.absent}
                    <div style="margin-top:10px;"><button class="btn-primary" style="font-size:10px; padding:4px 10px;" onclick="bulkWhatsApp(${h.id})">📲 Message All Absentees</button></div>
                    <details style="margin-top:10px; font-size:12px;">
                        <summary style="cursor:pointer; color:var(--primary-blue)">View Full Details</summary>
                        <div style="font-weight:bold; margin-top:10px; color:red;">Absents:</div>
                        ${aL.map(s => `
                            <div class="student-list-row">
                                <span>${s.roll}. ${s.name}</span>
                                <div>
                                    <button class="msg-btn" style="background:#25D366" onclick="smartMessage(${s.roll},'${h.date}','wa')">WA</button>
                                    <button class="msg-btn" style="background:#EA4335" onclick="smartMessage(${s.roll},'${h.date}','mail')">Mail</button>
                                </div>
                            </div>`).join('')}
                        <div style="font-weight:bold; margin-top:10px; color:green;">Present/Leave:</div>
                        ${pL.map(s => `<div class="student-list-row"><span>${s.roll}. ${s.name}</span><b>${s.status}</b></div>`).join('')}
                    </details>
                </div>`}).join('') : "No History.";
        }

        function smartMessage(roll, date, type) {
            const cls = appData.classes.find(c => c.id == appData.activeClassId);
            const student = cls.roster.find(s => s.roll == roll);
            
            if (!student) return alert("Student not found in roster!");
            
            let target = (type === 'wa') ? student.phone : student.email;
            
            if (!target || target.trim() === "") {
                return alert(`No ${type === 'wa' ? 'WhatsApp number' : 'email'} saved for Roll ${roll} in Settings!`);
            }

            let ct = target.replace(/\D/g, ''); 
            if (type === 'wa' && ct.length === 10) ct = "91" + ct;
            
            let msg = appData.language === 'ml' ? 
                `പ്രിയ രക്ഷിതാവേ,\n\n${appData.schoolName}-ൽ പഠിക്കുന്ന നിങ്ങളുടെ കുട്ടി ${student.name} (റോൾ നമ്പർ: ${roll}) ഇന്ന് (${date}) ഹാജരായിട്ടില്ല എന്ന് അറിയിക്കുന്നു.\n\nസ്നേഹത്തോടെ,\nക്ലാസ്സ് ടീച്ചർ` : 
                `Dear Parent,\n\nThis is to inform you that your child, ${student.name} (Roll No: ${roll}), was marked absent today (${date}) from ${appData.schoolName}.\n\nRegards,\nClass Teacher`;
            
            if (type === 'wa') window.open(`https://wa.me/${ct}?text=${encodeURIComponent(msg)}`, '_blank');
            else window.location.href = `mailto:${target}?subject=Absence Notification&body=${encodeURIComponent(msg)}`;
        }

        function bulkWhatsApp(hId) {
            const entry = appData.history.find(h => h.id === hId);
            const absents = entry.students.filter(s => s.status === 'Absent');
            if (!absents.length) return alert("No absentees found!");
            absents.forEach((s, idx) => setTimeout(() => smartMessage(s.roll, entry.date, 'wa'), idx * 1200));
        }

        function setupMonthPicker() { const p = document.getElementById('report-month-picker'); const dates = [...new Set(appData.history.map(h => h.date.substring(0, 7)))].sort().reverse(); p.innerHTML = dates.map(d => `<option value="${d}">${d}</option>`).join('') || "<option>No Data</option>"; }

        function refreshReportsView() {
            const m = document.getElementById('report-month-picker').value, cls = appData.classes.find(c => c.id == appData.activeClassId);
            let stats = {}; cls.roster.forEach(st => stats[st.roll] = { name: st.name, present: 0, absent: 0, leave: 0, total: 0 });
            const history = appData.history.filter(h => h.classId == cls.id && h.date.startsWith(m));
            history.forEach(day => {
                day.students.forEach(r => {
                    if (stats[r.roll]) {
                        stats[r.roll].total++;
                        if (r.status === 'Present') stats[r.roll].present++;
                        else if (r.status === 'Absent') stats[r.roll].absent++;
                        else if (r.status === 'Leave') stats[r.roll].leave++;
                    }
                });
            });
            const dayMap = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
            let dayCounts = [0,0,0,0,0,0,0];
            history.forEach(h => { dayCounts[new Date(h.date).getDay()] += h.absent; });
            const peakDay = dayMap[dayCounts.indexOf(Math.max(...dayCounts))];
            document.getElementById('trend-analysis').innerText = history.length ? `Trend: Most Absences on ${peakDay}s` : "No trends available.";

            document.getElementById('reports-display-container').innerHTML = Object.keys(stats).map(roll => {
                const s = stats[roll];
                const activePresent = s.present + s.leave;
                const per = s.total ? Math.round((activePresent / s.total) * 100) : 0;
                const isDanger = per < 75 && s.total > 0;
                return `
                    <div class="report-card ${isDanger ? 'danger-zone' : ''}">
                        ${per === 100 && s.total > 0 ? '<span class="badge-100">🌟 TOP</span>' : ''}
                        <b>${roll}. ${s.name}</b>
                        <div class="report-grid" style="grid-template-columns: repeat(3, 1fr);">
                            <div class="stat-box">P/L: ${activePresent}</div>
                            <div class="stat-box">A: ${s.absent}</div>
                            <div class="stat-box" style="color:${isDanger?'red':''}">${per}%</div>
                        </div>
                    </div>`;
            }).join('');
        }

        function exportReportToCSV() {
            const m = document.getElementById('report-month-picker').value, cls = appData.classes.find(c => c.id == appData.activeClassId);
            let csv = "Roll No,Name,Present,Absent,Leave,Total Days,Percentage\n";
            const stats = getStats(m);
            Object.keys(stats).sort((a,b)=>a-b).forEach(r => { const s = stats[r]; csv += `${r},${s.name},${s.present},${s.absent},${s.leave},${s.total},${s.total?Math.round(((s.present+s.leave)/s.total)*100):0}%\n`; });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = `Attendance_${cls.name}_${m}.csv`; link.click();
        }

        function getStats(month) {
            const cls = appData.classes.find(c => c.id == appData.activeClassId);
            let s = {}; cls.roster.forEach(st => s[st.roll] = { name: st.name, p: 0, a:0, l:0, t: 0 });
            appData.history.filter(h => h.classId == cls.id && h.date.startsWith(month)).forEach(day => {
                day.students.forEach(r => { if (s[r.roll]) { s[r.roll].t++; if (r.status === 'Present') s[r.roll].p++; else if (r.status === 'Absent') s[r.roll].a++; else if (r.status === 'Leave') s[r.roll].l++; }});
            });
            return s;
        }

        function removeStudent(idx) { if(confirm("Delete student?")) { const cls = appData.classes.find(c => c.id == appData.activeClassId); cls.roster.splice(idx,1); persistData(); refreshViews(); } }
        function removeClass(id) { if(appData.classes.length>1 && confirm("Delete class?")) { appData.history = appData.history.filter(h => h.classId != id); appData.classes = appData.classes.filter(c => c.id != id); appData.activeClassId = appData.classes[0].id; persistData(); refreshViews(); } }
        function wipeHistoryForCurrentClass() { if(confirm("Delete all history for this class?")) { appData.history = appData.history.filter(h => h.classId != appData.activeClassId); persistData(); renderHistoryView(); } }

        // --- FACTORY RESET APP WITH RESUBMISSION ---
        function factoryResetApp() {
            const currentSchool = appData.schoolName;
            const confirmation = prompt(`⚠️ WARNING: This will delete ALL classes, students, and history permanently.\n\nTo confirm, type your school name exactly as shown:\n"${currentSchool}"`);
            
            if (confirmation === currentSchool) {
                // Wipe everything
                localStorage.removeItem("pro_attendance_data");
                localStorage.removeItem("all_classes"); 
                localStorage.removeItem("attendance_history");
                localStorage.removeItem("school_name");
                localStorage.removeItem("msg_lang");
                localStorage.removeItem("active_class_id");
                
                alert("App has been successfully reset to factory defaults.");
                location.reload(); // Reload the page to trigger setup screen
            } else if (confirmation !== null) {
                alert("School name did not match. Reset cancelled.");
            }
        }

        // Start the app correctly based on setup status
        initApp();
    </script>
</body>
</html>
