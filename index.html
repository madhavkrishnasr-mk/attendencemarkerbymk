<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Attendance Pro (Direct Email)</title>
    <style>
        body { font-family: 'Segoe UI', Roboto, sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .card { background-color: #ffffff; width: 100%; max-width: 480px; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); box-sizing: border-box; }
        .hidden { display: none !important; }
        h3 { color: #1a1a1a; margin-top: 0; border-bottom: 2px solid #e4e6eb; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        input[type="text"], input[type="number"], input[type="date"], input[type="email"] { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        .row-flex { display: flex; gap: 8px; align-items: center; }
        button { background-color: #0056b3; color: white; border: none; padding: 10px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        .btn-full { width: 100%; font-size: 16px; margin-top: 15px; padding: 12px; }
        .btn-edit { background-color: #6c757d; font-size: 12px; padding: 6px 10px; margin-left: 5px; }
        .btn-history { background-color: #28a745; font-size: 12px; padding: 6px 10px; }
        .btn-delete { background-color: #dc3545; padding: 6px 10px; font-size: 11px; }
        .btn-email { background-color: #ea4335; color: white; padding: 5px 10px; text-decoration: none; border-radius: 5px; font-size: 12px; display: inline-block; margin-top: 5px; }
        .student-row { background-color: #f8f9fa; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #e4e6eb; }
        .student-main { display: flex; align-items: center; font-weight: bold; margin-bottom: 8px; }
        .student-box { transform: scale(1.5); margin-right: 15px; }
        .reason-box { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
        .history-card { background-color: #e9ecef; padding: 12px; margin-bottom: 10px; border-radius: 8px; border-left: 5px solid #0056b3; font-size: 14px; }
        .absentee-item { margin-top: 8px; padding-top: 8px; border-top: 1px dashed #ccc; }
        #status-msg { text-align: center; margin-top: 10px; font-weight: bold; color: #28a745; }
    </style>
</head>
<body>

<div class="card">
    <div id="attendance-view">
        <h3>
            <span id="display-class-name">Loading...</span>
            <div style="display:flex;">
                <button class="btn-history" onclick="showView('history-view')">History 📁</button>
                <button class="btn-edit" onclick="showView('edit-view')">⚙️</button>
            </div>
        </h3>
        <input type="date" id="class-date">
        <div id="student-container"></div>
        <button id="submit-btn" class="btn-full" onclick="submitAttendance()">Save Attendance</button>
        <div id="status-msg"></div>
    </div>

    <div id="edit-view" class="hidden">
        <h3>Settings <button class="btn-edit" onclick="showView('attendance-view')">Back ✔️</button></h3>
        
        <label><strong>Class Name:</strong></label>
        <div class="row-flex"><input type="text" id="class-name"><button onclick="saveSettings()">Save</button></div>
        
        <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">
        
        <label><strong>Add Student:</strong></label>
        <div class="row-flex">
            <input type="number" id="new-roll" placeholder="Roll" style="width: 25%;">
            <input type="text" id="new-name" placeholder="Name" style="width: 75%;">
        </div>
        <input type="email" id="new-email" placeholder="Parent Email Address (Optional)" style="margin-top:5px;">
        <button class="btn-full" onclick="addStudent()" style="margin-top:0">+ Add Student</button>
        <div id="management-list" style="margin-top:20px;"></div>
    </div>

    <div id="history-view" class="hidden">
        <h3>History & Emails <button class="btn-edit" onclick="showView('attendance-view')">Back ✔️</button></h3>
        <div id="history-container"></div>
        <button class="btn-full" style="background-color: #dc3545;" onclick="clearHistory()">Clear All History</button>
    </div>
</div>

<script>
    let myClass = JSON.parse(localStorage.getItem("attendance_roster")) || [];
    let currentClass = localStorage.getItem("class_details") || "New Class";
    let historyData = JSON.parse(localStorage.getItem("attendance_history")) || [];

    document.getElementById('class-date').valueAsDate = new Date();

    function showView(id) {
        ['attendance-view', 'edit-view', 'history-view'].forEach(v => document.getElementById(v).classList.add('hidden'));
        document.getElementById(id).classList.remove('hidden');
        if(id === 'attendance-view') updateScreen();
        if(id === 'history-view') renderHistory();
    }

    function updateScreen() {
        document.getElementById("class-name").value = currentClass;
        document.getElementById("display-class-name").innerText = currentClass;
        const attContainer = document.getElementById("student-container");
        const magContainer = document.getElementById("management-list");
        attContainer.innerHTML = ""; magContainer.innerHTML = "";
        myClass.sort((a, b) => a.rollNo - b.rollNo);

        if(myClass.length === 0) {
            attContainer.innerHTML = "<p style='text-align:center; color:#666;'>No students added yet. Go to Settings ⚙️ to add students.</p>";
        }

        myClass.forEach((s, i) => {
            // Attendance List
            attContainer.innerHTML += `
                <div class="student-row">
                    <div class="student-main">
                        <input type="checkbox" class="student-box" id="check-${i}" checked>
                        <label>Roll ${s.rollNo}: ${s.name}</label>
                    </div>
                    <input type="text" class="reason-box" id="reason-${i}" placeholder="Reason (If absent)">
                </div>`;
            
            // Settings List
            let emailText = s.email ? s.email : "No Email";
            magContainer.innerHTML += `
                <div class="student-row" style="display:flex; justify-content:space-between; align-items:center;">
                    <div style="font-size:13px;"><b>Roll ${s.rollNo}: ${s.name}</b><br><span style="color:#666;">${emailText}</span></div>
                    <button class="btn-delete" onclick="deleteStudent(${i})">Delete</button>
                </div>`;
        });
    }

    function saveSettings() {
        currentClass = document.getElementById("class-name").value;
        localStorage.setItem("class_details", currentClass);
        alert("Class name saved!");
        updateScreen();
    }

    function addStudent() {
        const r = document.getElementById("new-roll").value;
        const n = document.getElementById("new-name").value;
        const e = document.getElementById("new-email").value;
        
        if (r && n) {
            myClass.push({ rollNo: parseInt(r), name: n, email: e });
            localStorage.setItem("attendance_roster", JSON.stringify(myClass));
            
            document.getElementById("new-roll").value = "";
            document.getElementById("new-name").value = "";
            document.getElementById("new-email").value = "";
            updateScreen();
        } else {
            alert("Please enter at least Roll No and Name.");
        }
    }

    function deleteStudent(idx) {
        if(confirm("Are you sure?")) {
            myClass.splice(idx, 1);
            localStorage.setItem("attendance_roster", JSON.stringify(myClass));
            updateScreen();
        }
    }

    function submitAttendance() {
        if(myClass.length === 0) return alert("Please add students first!");
        
        const date = document.getElementById('class-date').value;
        const msg = document.getElementById('status-msg');

        let absenteesList = [];

        myClass.forEach((s, i) => {
            const isPresent = document.getElementById(`check-${i}`).checked;
            if (!isPresent) {
                const reasonText = document.getElementById(`reason-${i}`).value || "Not Specified";
                absenteesList.push({
                    roll: s.rollNo,
                    name: s.name,
                    reason: reasonText,
                    email: s.email
                });
            }
        });

        // Save to History
        historyData.unshift({ date: date, className: currentClass, absentees: absenteesList });
        localStorage.setItem("attendance_history", JSON.stringify(historyData));

        msg.innerText = "Saved successfully!";
        setTimeout(() => msg.innerText = "", 3000);
    }

    function renderHistory() {
        const container = document.getElementById("history-container");
        container.innerHTML = historyData.length ? "" : "<p style='text-align:center;'>No records found.</p>";
        
        historyData.forEach(record => {
            let absentHTML = "";
            
            if (record.absentees.length === 0) {
                absentHTML = "<div style='color:#28a745; margin-top:5px; font-weight:bold;'>Everyone was Present ✅</div>";
            } else {
                record.absentees.forEach(a => {
                    // Create the email content
                    let subject = encodeURIComponent(`Absence Notification: ${a.name}`);
                    let body = encodeURIComponent(`Dear Parent,\n\nThis is to inform you that ${a.name} (Roll No: ${a.roll}) was marked ABSENT today (${record.date}).\n\nReason recorded: ${a.reason}.\n\nRegards,\nClass Teacher`);
                    
                    let emailButton = a.email 
                        ? `<a href="mailto:${a.email}?subject=${subject}&body=${body}" class="btn-email">📧 Send Email</a>` 
                        : `<span style="font-size:12px; color:#888;">(No Email Added)</span>`;

                    absentHTML += `
                        <div class="absentee-item">
                            🔴 <b>Roll ${a.roll}: ${a.name}</b><br>
                            📝 <span style="color:#555;">Reason: ${a.reason}</span><br>
                            ${emailButton}
                        </div>`;
                });
            }

            container.innerHTML += `
                <div class="history-card">
                    <strong>📅 ${record.date}</strong> | ${record.className}
                    ${absentHTML}
                </div>`;
        });
    }

    function clearHistory() { 
        if(confirm("Delete all history?")) { 
            historyData = []; 
            localStorage.setItem("attendance_history", "[]"); 
            renderHistory(); 
        } 
    }

    showView('attendance-view');
</script>
</body>
</html>
