<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0056b3">
    <title>Attendance Pro</title>
    <style>
        :root { --bg: #f0f2f5; --card: #ffffff; --text: #1a1a1a; --border: #e4e6eb; --primary: #0056b3; --secondary: #6c757d; }
        .dark-mode { --bg: #18191a; --card: #242526; --text: #e4e6eb; --border: #3e4042; --primary: #2d88ff; --secondary: #4e4f50; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; transition: 0.3s; }
        .card { background: var(--card); width: 100%; max-width: 480px; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); box-sizing: border-box; }
        .hidden { display: none !important; }
        h3 { border-bottom: 2px solid var(--border); padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; margin-top:0; }
        input, select { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 8px; box-sizing: border-box; background: var(--bg); color: var(--text); }
        button { background: var(--primary); color: white; border: none; padding: 10px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        .btn-full { width: 100%; font-size: 16px; margin-top: 10px; padding: 15px; }
        .btn-red { background: #dc3545; }
        .student-row { background: var(--bg); padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid var(--border); }
        .student-photo { width: 45px; height: 45px; border-radius: 50%; object-fit: cover; margin-right: 12px; border: 2px solid var(--primary); }
        .tab-menu { display: flex; gap: 5px; margin-bottom: 15px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
        .tab-link { flex: 1; padding: 10px 5px; font-size: 13px; text-align: center; background: var(--bg); color: var(--text); border: 1px solid var(--border); }
        .tab-link.active { background: var(--primary); color: white; border-color: var(--primary); }
        .report-stat { display:flex; justify-content:space-between; width:100%; font-size:12px; margin-top:5px; background:var(--bg); padding:8px; border-radius:5px; }
        .status-toggle { display: flex; width: 100%; border-radius: 8px; overflow: hidden; margin-top: 8px; border: 1px solid var(--border); }
        .toggle-btn { flex: 1; padding: 8px; text-align: center; font-weight: bold; cursor: pointer; background: var(--bg); color: var(--text); border: none; }
        .toggle-btn.present.active { background: #28a745; color: white; }
        .toggle-btn.absent.active { background: #dc3545; color: white; }
        .line-item { display: flex; justify-content: space-between; align-items: center; padding: 8px; border-bottom: 1px solid var(--border); }
    </style>
</head>
<body>

<div class="card">
    <h3 id="class-title"><span>Attendance Pro</span>
        <div><button onclick="toggleTheme()" style="background:none; font-size:20px; color:var(--text)">🌓</button><button onclick="showView('settings-view')">⚙️</button></div>
    </h3>

    <div id="attendance-view">
        <label>Select Class:</label>
        <select id="class-selector" onchange="switchClass(this.value)"></select>
        <div style="display:flex; gap:10px; margin-bottom:15px;">
            <input type="date" id="class-date" style="margin-bottom:0;">
            <button style="background:#28a745; flex:1;" onclick="showView('history-view')">📁 History</button>
            <button style="background:#17a2b8; flex:1;" onclick="showView('report-view')">📊 Reports</button>
        </div>
        <div id="student-container"></div>
        <button class="btn-full" onclick="submitAttendance()">Save Attendance</button>
    </div>

    <div id="settings-view" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <b style="font-size:18px;">Settings</b><button style="background:var(--secondary);" onclick="showView('attendance-view')">Close</button>
        </div>
        <div class="tab-menu">
            <button id="tab-btn-global" class="tab-link active" onclick="switchSettingsTab('global')">🏫 School</button>
            <button id="tab-btn-class" class="tab-link" onclick="switchSettingsTab('class')">📚 Classes</button>
            <button id="tab-btn-student" class="tab-link" onclick="switchSettingsTab('student')">🧑‍🎓 Students</button>
        </div>
        <div id="tab-global">
            <label>School Name:</label><input type="text" id="school-name">
            <label>Language:</label><select id="msg-lang"><option value="en">English</option><option value="ml">Malayalam</option></select>
            <button class="btn-full" onclick="saveGlobalSettings()">Save Settings</button>
        </div>
        <div id="tab-class" class="hidden">
            <input type="text" id="new-class-name" placeholder="Class Name"><button class="btn-full" onclick="addClass()">Add Class</button>
            <div id="class-management-list" style="margin-top:10px;"></div>
        </div>
        <div id="tab-student" class="hidden">
            <input type="number" id="new-roll" placeholder="Roll No"><input type="text" id="new-name" placeholder="Name">
            <input type="tel" id="new-phone" placeholder="WhatsApp Number"><input type="file" id="new-photo">
            <button class="btn-full" id="add-student-btn" onclick="handleAddStudent()">Add Student</button>
            <div id="student-management-list" style="margin-top:15px;"></div>
        </div>
    </div>

    <div id="report-view" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center;"><b>📊 Attendance Summary</b><button onclick="showView('attendance-view')">Back</button></div>
        <button class="btn-full" style="background:#007bff; margin-top:15px;" onclick="downloadCSV()">📥 Download Full Class Report (CSV)</button>
        <div id="report-container" style="margin-top:15px;"></div>
    </div>

    <div id="history-view" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center;"><b>📁 History</b><button onclick="showView('attendance-view')">Back</button></div>
        <div id="history-container" style="margin-top:15px;"></div>
        <button class="btn-full btn-red" onclick="clearHistory()">Clear All History</button>
    </div>
</div>

<script>
    let classes = JSON.parse(localStorage.getItem("all_classes")) || [{ id: Date.now(), name: "Class 1", roster: [] }];
    let currentClassId = localStorage.getItem("active_class_id") || classes[0].id;
    let historyData = JSON.parse(localStorage.getItem("attendance_history")) || [];
    let schoolName = localStorage.getItem("school_name") || "Our School";
    let msgLang = localStorage.getItem("msg_lang") || "en";
    let editingStudentIndex = -1;

    function save() { localStorage.setItem("all_classes", JSON.stringify(classes)); localStorage.setItem("active_class_id", currentClassId); }
    function saveGlobalSettings() { schoolName = document.getElementById("school-name").value || "Our School"; msgLang = document.getElementById("msg-lang").value; localStorage.setItem("school_name", schoolName); localStorage.setItem("msg_lang", msgLang); alert("Saved!"); }
    function toggleTheme() { document.body.classList.toggle('dark-mode'); localStorage.setItem("theme", document.body.classList.contains('dark-mode') ? "dark" : "light"); }
    if(localStorage.getItem("theme") === "dark") document.body.classList.add('dark-mode');

    function showView(id) { document.querySelectorAll('.card > div').forEach(v => v.classList.add('hidden')); document.getElementById(id).classList.remove('hidden'); renderAll(); if(id==='report-view') renderReport(); if(id==='history-view') renderHistory(); }
    function switchSettingsTab(t) { ['global','class','student'].forEach(k => { document.getElementById('tab-'+k).classList.add('hidden'); document.getElementById('tab-btn-'+k).classList.remove('active'); }); document.getElementById('tab-'+t).classList.remove('hidden'); document.getElementById('tab-btn-'+t).classList.add('active'); }

    function setStatus(idx, s) { document.getElementById(`status-val-${idx}`).value = s; document.getElementById(`btn-p-${idx}`).classList.toggle('active', s==='Present'); document.getElementById(`btn-a-${idx}`).classList.toggle('active', s==='Absent'); }

    function renderAll() {
        const cls = classes.find(c => c.id == currentClassId) || classes[0];
        document.getElementById("class-title").querySelector('span').innerText = cls.name;
        document.getElementById("school-name").value = schoolName;
        document.getElementById("msg-lang").value = msgLang;
        document.getElementById("class-selector").innerHTML = classes.map(c => `<option value="${c.id}" ${c.id == currentClassId ? 'selected' : ''}>${c.name}</option>`).join('');
        const cont = document.getElementById("student-container");
        cont.innerHTML = cls.roster.length ? "" : "<p style='text-align:center;'>No students. Go to Settings.</p>";
        cls.roster.sort((a,b)=>a.roll-b.roll).forEach((s,i) => {
            cont.innerHTML += `<div class="student-row"><div style="display:flex; align-items:center;"><img src="${s.photo||''}" class="student-photo" onerror="this.style.display='none'"><label>Roll ${s.roll}: ${s.name}</label></div><div class="status-toggle"><input type="hidden" id="status-val-${i}" value="Present"><button class="toggle-btn present active" id="btn-p-${i}" onclick="setStatus(${i},'Present')">P</button><button class="toggle-btn absent" id="btn-a-${i}" onclick="setStatus(${i},'Absent')">A</button></div><input type="text" id="reason-${i}" placeholder="Remarks" style="margin-top:5px;"></div>`;
        });
        document.getElementById("class-management-list").innerHTML = classes.map(c => `<div class="line-item"><span>${c.name}</span><button class="btn-red" onclick="deleteClass(${c.id})">Del</button></div>`).join('');
        document.getElementById("student-management-list").innerHTML = cls.roster.map((s,i)=>`<div class="line-item"><span>${s.roll}. ${s.name}</span><button onclick="editStudent(${i})">Edit</button></div>`).join('');
    }

    function addClass() { const n = document.getElementById("new-class-name").value; if(!n) return; classes.push({id:Date.now(), name:n, roster:[]}); save(); renderAll(); }
    function deleteClass(id) { if(classes.length>1 && confirm("Delete?")) { classes = classes.filter(c=>c.id!=id); currentClassId = classes[0].id; save(); renderAll(); } }
    function switchClass(id) { currentClassId = id; save(); renderAll(); }

    function handleAddStudent() {
        const r = document.getElementById("new-roll").value, n = document.getElementById("new-name").value, p = document.getElementById("new-phone").value, f = document.getElementById("new-photo").files[0], cls = classes.find(c=>c.id==currentClassId);
        if(!r || !n) return alert("Required!");
        const saveS = (img) => { if(editingStudentIndex > -1) { cls.roster[editingStudentIndex] = {roll:parseInt(r), name:n, phone:p, photo:img||cls.roster[editingStudentIndex].photo}; editingStudentIndex = -1; } else cls.roster.push({roll:parseInt(r), name:n, phone:p, photo:img}); save(); renderAll(); };
        if(f) { const reader = new FileReader(); reader.onload=(e)=>saveS(e.target.result); reader.readAsDataURL(f); } else saveS("");
    }

    function submitAttendance() {
        const cls = classes.find(c=>c.id==currentClassId), d = document.getElementById('class-date').value;
        if(!d) return alert("Select Date!");
        let p=0, recs = cls.roster.map((s,i)=>{ const st = document.getElementById(`status-val-${i}`).value; if(st==='Present') p++; return {roll:s.roll, name:s.name, status:st, phone:s.phone, reason:document.getElementById(`reason-${i}`).value}; });
        historyData.unshift({date:d, className:cls.name, total:cls.roster.length, present:p, absent:cls.roster.length-p, records:recs});
        localStorage.setItem("attendance_history", JSON.stringify(historyData)); alert("Saved!");
    }

    function getStats() {
        const cls = classes.find(c=>c.id==currentClassId);
        let s = {}; cls.roster.forEach(st => s[st.roll] = {name:st.name, present:0, absent:0, total:0});
        historyData.filter(h=>h.className===cls.name).forEach(day => day.records.forEach(r => { if(s[r.roll]){ s[r.roll].total++; if(r.status==='Present') s[r.roll].present++; else s[r.roll].absent++; }}));
        return s;
    }

    function renderReport() {
        const s = getStats(), cont = document.getElementById("report-container");
        cont.innerHTML = Object.keys(s).map(r => {
            const d = s[r]; if(d.total===0) return `<div class="line-item">${r}. ${d.name} - No records</div>`;
            const p = Math.round((d.present/d.total)*100);
            return `<div class="line-item" style="flex-direction:column; align-items:flex-start;"><b>${r}. ${d.name}</b><div class="report-stat"><span>P: ${d.present}</span><span>A: ${d.absent}</span><span>T: ${d.total}</span><b>${p}%</b></div></div>`;
        }).join('');
    }

    function downloadCSV() {
        const s = getStats(), cls = classes.find(c=>c.id==currentClassId);
        let csv = "Roll No,Student Name,Present Days,Absent Days,Total Days,Percentage(%)\n";
        Object.keys(s).sort((a,b)=>a-b).forEach(r => { const d = s[r]; csv += `${r},${d.name},${d.present},${d.absent},${d.total},${d.total?Math.round((d.present/d.total)*100):0}%\n`; });
        const blob = new Blob([csv], {type: 'text/csv'}), url = window.URL.createObjectURL(blob), a = document.createElement('a');
        a.href = url; a.download = `Attendance_Report_${cls.name}.csv`; a.click();
    }

    function renderHistory() {
        document.getElementById("history-container").innerHTML = historyData.map(day => `<div class="history-card"><b>${day.date} - ${day.className}</b><details><summary>Details (P:${day.present} A:${day.absent})</summary>${day.records.map(r => `<div class="line-item"><span>${r.name}</span><span style="color:${r.status==='Present'?'green':'red'}">${r.status}</span></div>`).join('')}</details></div>`).join('');
    }

    function clearHistory() { if(confirm("Clear All?")) { historyData = []; localStorage.setItem("attendance_history", "[]"); renderHistory(); } }
    showView('attendance-view');
</script>
</body>
</html>
